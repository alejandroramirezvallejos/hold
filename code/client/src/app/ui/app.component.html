<section class="app-shell">
  <app-navbar></app-navbar>
  <router-outlet></router-outlet>
</section>

@if (cargando()) {
  <app-pantalla-carga></app-pantalla-carga>
}

@if (toast.visible()) {
  @if (toast.kind() === "success") {
    <app-aviso-exito
      [exito]="toast.visible"
      [mensaje]="toast.message()"
    ></app-aviso-exito>
  } @else {
    <app-mostrarerror
      [error]="toast.visible"
      [mensaje]="toast.message()"
    ></app-mostrarerror>
  }
}
